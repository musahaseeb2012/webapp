<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Creator - Create Your Comics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2a 25%, #2a1a3a 50%, #1a0a2a 75%, #0a0a0a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(142, 36, 170, 0.1);
            border-radius: 15px;
            border: 2px solid #8e24aa;
            box-shadow: 0 0 20px rgba(142, 36, 170, 0.3);
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #8e24aa, #00bcd4, #8e24aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #00bcd4;
            font-size: 1.1em;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .sidebar {
            background: rgba(142, 36, 170, 0.1);
            border-radius: 15px;
            border: 2px solid #8e24aa;
            padding: 20px;
            height: fit-content;
        }

        .sidebar h2 {
            color: #8e24aa;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .tool-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #8e24aa, #00bcd4);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 0.95em;
        }

        .tool-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(142, 36, 170, 0.5);
        }

        .tool-btn:active {
            transform: translateY(0);
        }

        .tool-btn.active {
            background: linear-gradient(135deg, #00bcd4, #ff6b35);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .canvas-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 2px solid #8e24aa;
            padding: 20px;
            min-height: 600px;
        }

        .comic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .comic-panel {
            background: white;
            border: 3px solid #000;
            border-radius: 10px;
            min-height: 300px;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        .panel-number {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #8e24aa;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9em;
            z-index: 10;
        }

        .delete-panel {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ff0000;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }

        .delete-panel:hover {
            background: #cc0000;
        }

        .speech-bubble {
            position: absolute;
            background: white;
            border: 2px solid #000;
            border-radius: 15px;
            padding: 10px 15px;
            min-width: 80px;
            max-width: 200px;
            cursor: move;
            z-index: 5;
            word-wrap: break-word;
            color: #000;
            font-size: 0.9em;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 20px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #000;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 22px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid white;
            z-index: 1;
        }

        .thought-bubble {
            border-radius: 50% 50% 50% 0;
        }

        .thought-bubble::after {
            content: '◯';
            position: absolute;
            bottom: -25px;
            left: 15px;
            font-size: 12px;
            color: #000;
            border: none;
        }

        .thought-bubble::before {
            content: '◯';
            position: absolute;
            bottom: -35px;
            left: 10px;
            font-size: 8px;
            color: #000;
            border: none;
        }

        .bubble-delete {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
        }

        .script-panel {
            background: rgba(142, 36, 170, 0.1);
            border-radius: 15px;
            border: 2px solid #8e24aa;
            padding: 20px;
        }

        .script-panel h2 {
            color: #8e24aa;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .script-editor {
            width: 100%;
            min-height: 400px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00bcd4;
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            resize: vertical;
        }

        .script-editor:focus {
            outline: none;
            border-color: #8e24aa;
            box-shadow: 0 0 10px rgba(142, 36, 170, 0.5);
        }

        .panel-script {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            border-left: 3px solid #8e24aa;
        }

        .panel-script-title {
            color: #00bcd4;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .panel-script-content {
            color: #ccc;
            font-size: 0.9em;
            font-family: 'Courier New', monospace;
        }

        .file-input {
            display: none;
        }

        .uploaded-image {
            max-width: 100%;
            max-height: 100%;
            position: absolute;
            cursor: move;
            z-index: 1;
        }

        .drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .drawing-canvas.active {
            pointer-events: all;
        }

        .color-picker {
            margin: 10px 0;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            cursor: pointer;
            border: 2px solid #fff;
        }

        .color-option.active {
            border: 3px solid #ff6b35;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .save-load-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a0a1a;
            border: 2px solid #8e24aa;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h3 {
            color: #8e24aa;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00bcd4;
            border-radius: 8px;
            color: white;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, #8e24aa, #00bcd4);
            color: white;
        }

        .modal-btn-secondary {
            background: #666;
            color: white;
        }

        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Comic Creator ⚔️</h1>
            <p class="subtitle">Create amazing comics with panels, speech bubbles, and scripts!</p>
            <div style="margin-top: 15px;">
                <a href="index.html" style="display: inline-block; padding: 8px 16px; background: rgba(142, 36, 170, 0.3); color: #00bcd4; text-decoration: none; border-radius: 8px; border: 1px solid #8e24aa; font-size: 0.9em;">
                    ← Back to To-Do List
                </a>
            </div>
        </header>

        <div class="main-layout">
            <!-- Tools Sidebar -->
            <div class="sidebar">
                <h2>🎨 Tools</h2>
                <button class="tool-btn" onclick="addPanel()">➕ Add Panel</button>
                <button class="tool-btn" id="speechBubbleBtn" onclick="toggleTool('speech')">💬 Speech Bubble</button>
                <button class="tool-btn" id="thoughtBubbleBtn" onclick="toggleTool('thought')">💭 Thought Bubble</button>
                <button class="tool-btn" onclick="document.getElementById('imageUpload').click()">🖼️ Upload Image</button>
                <button class="tool-btn" id="drawBtn" onclick="toggleTool('draw')">✏️ Draw</button>
                <button class="tool-btn" onclick="clearAll()">🗑️ Clear All</button>

                <div class="color-picker">
                    <h3 style="color: #00bcd4; font-size: 0.9em; margin-bottom: 10px;">Draw Color:</h3>
                    <div class="color-option" style="background: #000000;" onclick="setDrawColor('#000000')"></div>
                    <div class="color-option" style="background: #8e24aa;" onclick="setDrawColor('#8e24aa')"></div>
                    <div class="color-option" style="background: #0000ff;" onclick="setDrawColor('#0000ff')"></div>
                    <div class="color-option" style="background: #ff0000;" onclick="setDrawColor('#ff0000')"></div>
                </div>

                <div class="save-load-btns">
                    <button class="tool-btn" onclick="saveComic()">💾 Save</button>
                    <button class="tool-btn" onclick="loadComic()">📂 Load</button>
                </div>
            </div>

            <!-- Canvas Area -->
            <div class="canvas-area">
                <div class="comic-grid" id="comicGrid">
                    <!-- Panels will be added here -->
                </div>
            </div>

            <!-- Script Panel -->
            <div class="script-panel">
                <h2>📝 Comic Script</h2>
                <div id="scriptDisplay"></div>
                <textarea class="script-editor" id="scriptEditor" placeholder="Write your comic script here...

Panel 1:
Setting: A sunny day in the park
Character A: Hello there!
Character B: Hi! Nice to meet you!

Panel 2:
..."></textarea>
            </div>
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="imageUpload" class="file-input" accept="image/*" onchange="handleImageUpload(event)">

    <!-- Modal for text input -->
    <div class="modal" id="textModal">
        <div class="modal-content">
            <h3>Enter Bubble Text</h3>
            <textarea class="modal-input" id="bubbleText" rows="3" placeholder="Enter text here..."></textarea>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="confirmBubbleText()">Add</button>
            </div>
        </div>
    </div>

    <script>
        let panels = [];
        let currentTool = null;
        let currentPanel = null;
        let currentBubbleType = 'speech';
        let drawColor = '#000000';
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let pendingBubble = null;

        function addPanel() {
            const panelId = Date.now();
            const panel = {
                id: panelId,
                bubbles: [],
                images: [],
                canvasData: null
            };
            panels.push(panel);
            renderPanels();
        }

        function renderPanels() {
            const grid = document.getElementById('comicGrid');
            grid.innerHTML = '';

            panels.forEach((panel, index) => {
                const panelDiv = document.createElement('div');
                panelDiv.className = 'comic-panel';
                panelDiv.id = `panel-${panel.id}`;
                panelDiv.onclick = (e) => handlePanelClick(panel.id, e);

                panelDiv.innerHTML = `
                    <div class="panel-number">Panel ${index + 1}</div>
                    <button class="delete-panel" onclick="deletePanel(${panel.id}, event)">×</button>
                    <canvas class="drawing-canvas" id="canvas-${panel.id}"></canvas>
                `;

                grid.appendChild(panelDiv);

                // Restore canvas
                const canvas = document.getElementById(`canvas-${panel.id}`);
                const panelDiv2 = document.getElementById(`panel-${panel.id}`);
                canvas.width = panelDiv2.offsetWidth;
                canvas.height = panelDiv2.offsetHeight;

                if (panel.canvasData) {
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = panel.canvasData;
                }

                // Setup canvas drawing
                setupCanvas(canvas, panel.id);

                // Restore bubbles
                panel.bubbles.forEach(bubble => {
                    createBubbleElement(panel.id, bubble);
                });

                // Restore images
                panel.images.forEach(img => {
                    createImageElement(panel.id, img);
                });
            });

            updateScript();
        }

        function setupCanvas(canvas, panelId) {
            const ctx = canvas.getContext('2d');

            canvas.onmousedown = (e) => {
                if (currentTool !== 'draw') return;
                e.stopPropagation();
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                lastX = e.clientX - rect.left;
                lastY = e.clientY - rect.top;
            };

            canvas.onmousemove = (e) => {
                if (!isDrawing || currentTool !== 'draw') return;
                e.stopPropagation();
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                ctx.strokeStyle = drawColor;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();

                lastX = x;
                lastY = y;
            };

            canvas.onmouseup = () => {
                if (isDrawing) {
                    isDrawing = false;
                    saveCanvasData(panelId);
                }
            };
        }

        function saveCanvasData(panelId) {
            const canvas = document.getElementById(`canvas-${panelId}`);
            const panel = panels.find(p => p.id === panelId);
            if (panel) {
                panel.canvasData = canvas.toDataURL();
            }
        }

        function deletePanel(panelId, event) {
            event.stopPropagation();
            panels = panels.filter(p => p.id !== panelId);
            renderPanels();
        }

        function toggleTool(tool) {
            // Deactivate all tools
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));

            // Deactivate all canvases
            document.querySelectorAll('.drawing-canvas').forEach(canvas => {
                canvas.classList.remove('active');
            });

            if (currentTool === tool) {
                currentTool = null;
                return;
            }

            currentTool = tool;

            if (tool === 'speech') {
                currentBubbleType = 'speech';
                document.getElementById('speechBubbleBtn').classList.add('active');
            } else if (tool === 'thought') {
                currentBubbleType = 'thought';
                document.getElementById('thoughtBubbleBtn').classList.add('active');
            } else if (tool === 'draw') {
                document.getElementById('drawBtn').classList.add('active');
                document.querySelectorAll('.drawing-canvas').forEach(canvas => {
                    canvas.classList.add('active');
                });
            }
        }

        function handlePanelClick(panelId, event) {
            if (currentTool === 'speech' || currentTool === 'thought') {
                const rect = event.currentTarget.getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                pendingBubble = { panelId, x, y, type: currentBubbleType };
                document.getElementById('textModal').classList.add('active');
                document.getElementById('bubbleText').value = '';
                document.getElementById('bubbleText').focus();
            }
        }

        function closeModal() {
            document.getElementById('textModal').classList.remove('active');
            pendingBubble = null;
        }

        function confirmBubbleText() {
            const text = document.getElementById('bubbleText').value.trim();
            if (!text || !pendingBubble) {
                closeModal();
                return;
            }

            const bubble = {
                id: Date.now(),
                text: text,
                x: pendingBubble.x,
                y: pendingBubble.y,
                type: pendingBubble.type
            };

            const panel = panels.find(p => p.id === pendingBubble.panelId);
            if (panel) {
                panel.bubbles.push(bubble);
                createBubbleElement(pendingBubble.panelId, bubble);
                updateScript();
            }

            closeModal();
        }

        function createBubbleElement(panelId, bubble) {
            const panelDiv = document.getElementById(`panel-${panelId}`);
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `speech-bubble ${bubble.type === 'thought' ? 'thought-bubble' : ''}`;
            bubbleDiv.style.left = bubble.x + 'px';
            bubbleDiv.style.top = bubble.y + 'px';
            bubbleDiv.textContent = bubble.text;
            bubbleDiv.id = `bubble-${bubble.id}`;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'bubble-delete';
            deleteBtn.textContent = '×';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deleteBubble(panelId, bubble.id);
            };
            bubbleDiv.appendChild(deleteBtn);

            // Make draggable
            makeDraggable(bubbleDiv, panelId, bubble.id);

            panelDiv.appendChild(bubbleDiv);
        }

        function makeDraggable(element, panelId, bubbleId) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            element.onmousedown = (e) => {
                if (e.target.classList.contains('bubble-delete')) return;
                e.stopPropagation();
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = element.offsetLeft;
                initialTop = element.offsetTop;
                element.style.cursor = 'grabbing';
            };

            document.onmousemove = (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                element.style.left = (initialLeft + dx) + 'px';
                element.style.top = (initialTop + dy) + 'px';
            };

            document.onmouseup = () => {
                if (isDragging) {
                    isDragging = false;
                    element.style.cursor = 'move';
                    updateBubblePosition(panelId, bubbleId, element.offsetLeft, element.offsetTop);
                }
            };
        }

        function updateBubblePosition(panelId, bubbleId, x, y) {
            const panel = panels.find(p => p.id === panelId);
            if (panel) {
                const bubble = panel.bubbles.find(b => b.id === bubbleId);
                if (bubble) {
                    bubble.x = x;
                    bubble.y = y;
                }
            }
        }

        function deleteBubble(panelId, bubbleId) {
            const panel = panels.find(p => p.id === panelId);
            if (panel) {
                panel.bubbles = panel.bubbles.filter(b => b.id !== bubbleId);
                document.getElementById(`bubble-${bubbleId}`).remove();
                updateScript();
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                // Add to first panel or create one
                if (panels.length === 0) {
                    addPanel();
                }

                const panelId = panels[0].id;
                const img = {
                    id: Date.now(),
                    src: e.target.result,
                    x: 50,
                    y: 50
                };

                panels[0].images.push(img);
                createImageElement(panelId, img);
            };
            reader.readAsDataURL(file);
        }

        function createImageElement(panelId, img) {
            const panelDiv = document.getElementById(`panel-${panelId}`);
            const imgElement = document.createElement('img');
            imgElement.className = 'uploaded-image';
            imgElement.src = img.src;
            imgElement.style.left = img.x + 'px';
            imgElement.style.top = img.y + 'px';
            imgElement.style.maxWidth = '150px';
            imgElement.id = `img-${img.id}`;

            // Make draggable
            makeImageDraggable(imgElement, panelId, img.id);

            panelDiv.appendChild(imgElement);
        }

        function makeImageDraggable(element, panelId, imgId) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            element.onmousedown = (e) => {
                e.stopPropagation();
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = element.offsetLeft;
                initialTop = element.offsetTop;
                element.style.cursor = 'grabbing';
            };

            document.onmousemove = (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                element.style.left = (initialLeft + dx) + 'px';
                element.style.top = (initialTop + dy) + 'px';
            };

            document.onmouseup = () => {
                if (isDragging) {
                    isDragging = false;
                    element.style.cursor = 'move';
                    updateImagePosition(panelId, imgId, element.offsetLeft, element.offsetTop);
                }
            };
        }

        function updateImagePosition(panelId, imgId, x, y) {
            const panel = panels.find(p => p.id === panelId);
            if (panel) {
                const img = panel.images.find(i => i.id === imgId);
                if (img) {
                    img.x = x;
                    img.y = y;
                }
            }
        }

        function setDrawColor(color) {
            drawColor = color;
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('active'));
            event.target.classList.add('active');
        }

        function updateScript() {
            const scriptDisplay = document.getElementById('scriptDisplay');
            scriptDisplay.innerHTML = '';

            panels.forEach((panel, index) => {
                if (panel.bubbles.length > 0) {
                    const panelScript = document.createElement('div');
                    panelScript.className = 'panel-script';

                    const title = document.createElement('div');
                    title.className = 'panel-script-title';
                    title.textContent = `Panel ${index + 1}:`;
                    panelScript.appendChild(title);

                    const content = document.createElement('div');
                    content.className = 'panel-script-content';
                    content.innerHTML = panel.bubbles.map(b =>
                        `${b.type === 'thought' ? '(thinking)' : ''} "${b.text}"`
                    ).join('<br>');
                    panelScript.appendChild(content);

                    scriptDisplay.appendChild(panelScript);
                }
            });
        }

        function saveComic() {
            const comicData = {
                panels: panels,
                script: document.getElementById('scriptEditor').value,
                timestamp: Date.now()
            };

            const dataStr = JSON.stringify(comicData);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `comic_${Date.now()}.json`;
            link.click();

            // Also save to localStorage
            localStorage.setItem('comic_autosave', dataStr);
            alert('Comic saved! 💾');
        }

        function loadComic() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const comicData = JSON.parse(event.target.result);
                        panels = comicData.panels;
                        document.getElementById('scriptEditor').value = comicData.script || '';
                        renderPanels();
                        alert('Comic loaded! 📂');
                    } catch (err) {
                        alert('Error loading comic file!');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function clearAll() {
            if (confirm('Are you sure you want to clear everything?')) {
                panels = [];
                document.getElementById('scriptEditor').value = '';
                renderPanels();
            }
        }

        // Auto-save every 30 seconds
        setInterval(() => {
            if (panels.length > 0) {
                const comicData = {
                    panels: panels,
                    script: document.getElementById('scriptEditor').value,
                    timestamp: Date.now()
                };
                localStorage.setItem('comic_autosave', JSON.stringify(comicData));
            }
        }, 30000);

        // Load autosave on startup
        window.onload = () => {
            const autosave = localStorage.getItem('comic_autosave');
            if (autosave) {
                try {
                    const comicData = JSON.parse(autosave);
                    if (confirm('Found an autosaved comic. Load it?')) {
                        panels = comicData.panels;
                        document.getElementById('scriptEditor').value = comicData.script || '';
                        renderPanels();
                    }
                } catch (err) {
                    console.error('Error loading autosave:', err);
                }
            }

            // Initialize with one panel
            if (panels.length === 0) {
                addPanel();
            }
        };

        // Set default color
        document.querySelector('.color-option').classList.add('active');
    </script>
</body>
</html>
