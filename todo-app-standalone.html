<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>To-Do List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            /* Black and yellow gradient background */
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 204, 0, 0.1) 0%, transparent 50%);
            /*
            FREE UNSPLASH ALTERNATIVES - Replace above with any of these:

            Option 1 - Pink/Black Abstract:
            url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1920'),

            Option 2 - Neon Pink Abstract:
            url('https://images.unsplash.com/photo-1557672172-298e090bd0f1?w=1920'),

            Option 3 - Dark Pink Gradient:
            url('https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=1920'),

            Then add dark overlay:
            linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.85)),
            */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 3px solid #ffd700;
            border-radius: 20px;
            box-shadow:
                0 0 40px rgba(255, 215, 0, 0.5),
                0 0 80px rgba(255, 215, 0, 0.3),
                inset 0 0 60px rgba(255, 215, 0, 0.05);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow:
                0 0 10px rgba(255, 215, 0, 0.8),
                0 0 20px rgba(255, 215, 0, 0.6),
                0 0 30px rgba(255, 215, 0, 0.4),
                0 0 40px rgba(255, 215, 0, 0.2);
            background: linear-gradient(135deg, #ffd700 0%, #ffcc00 50%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        h1::before {
            content: '⚡';
            position: absolute;
            left: -40px;
            color: #ffd700;
            -webkit-text-fill-color: #ffd700;
            animation: pulse 2s infinite;
        }

        h1::after {
            content: '⚡';
            position: absolute;
            right: -40px;
            color: #ffd700;
            -webkit-text-fill-color: #ffd700;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #todoInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s;
            background: rgba(26, 26, 26, 0.6);
            color: #fff;
            backdrop-filter: blur(5px);
        }

        #todoInput:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.4),
                inset 0 0 10px rgba(255, 215, 0, 0.1);
            background: rgba(26, 26, 26, 0.8);
        }

        #todoInput::placeholder {
            color: #999;
            font-style: italic;
        }

        #addBtn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #ffd700 0%, #ffcc00 100%);
            color: #000;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.6),
                0 4px 15px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        #addBtn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        #addBtn:hover::before {
            left: 100%;
        }

        #addBtn:hover {
            background: #000;
            color: #fff;
            box-shadow:
                0 0 30px rgba(255, 215, 0, 0.8),
                0 4px 20px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        #addBtn:active {
            transform: scale(0.98);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 24px;
            background: transparent;
            border: 2px solid #ffd700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffd700;
        }

        .filter-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: #ffcc00;
            color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .filter-btn:active {
            transform: scale(0.95);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ffd700 0%, #ffcc00 100%);
            color: #000;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .todo-list {
            list-style: none;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 18px;
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.8) 0%, rgba(42, 42, 42, 0.6) 100%);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 15px;
            margin-bottom: 12px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease-out;
            backdrop-filter: blur(5px);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .todo-item:hover {
            background: linear-gradient(135deg, rgba(42, 42, 42, 0.9) 0%, rgba(51, 51, 51, 0.7) 100%);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            transform: translateX(8px);
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #666;
        }

        .todo-checkbox {
            width: 22px;
            height: 22px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #ffd700;
            filter: drop-shadow(0 0 3px rgba(255, 215, 0, 0.5));
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #fff;
        }

        .delete-btn {
            background: transparent;
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .delete-btn:hover {
            background: linear-gradient(135deg, #ffd700 0%, #ffcc00 100%);
            color: #000;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            transform: scale(1.05);
        }

        .delete-btn:active {
            transform: scale(0.98);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid #333;
            font-size: 14px;
            color: #aaa;
        }

        #clearCompleted {
            background: transparent;
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #clearCompleted:hover {
            background: linear-gradient(135deg, #ffd700 0%, #ffcc00 100%);
            color: #000;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            transform: scale(1.05);
        }

        #clearCompleted:active {
            transform: scale(0.98);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }

        /* Achievement Stats */
        .achievement-stats {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #333;
        }

        .total-completed {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 204, 0, 0.1) 100%);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            transition: all 0.3s;
        }

        .total-completed:hover {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .completed-icon {
            font-size: 24px;
            color: #ffd700;
            font-weight: bold;
        }

        #totalCompleted {
            font-size: 32px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            min-width: 40px;
            text-align: center;
        }

        .completed-label {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Milestone Badge - Special for every 5 tasks */
        .milestone-badge {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ffd700 0%, #ffcc00 50%, #ffd700 100%);
            border: 5px solid #ffd700;
            border-radius: 50%;
            width: 250px;
            height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 60px rgba(255, 215, 0, 0.8),
                0 0 120px rgba(255, 215, 0, 0.6),
                0 15px 40px rgba(0, 0, 0, 0.6);
            z-index: 1001;
            opacity: 0;
            transition: all 0.6s ease-out;
        }

        .milestone-badge.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            animation: milestonePulse 0.6s ease-out, milestoneRotate 1s ease-out;
        }

        @keyframes milestonePulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            33% { transform: translate(-50%, -50%) scale(1.15); }
            66% { transform: translate(-50%, -50%) scale(0.95); }
        }

        @keyframes milestoneRotate {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-360deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }

        .milestone-badge .milestone-icon {
            font-size: 80px;
            margin-bottom: 15px;
            animation: iconBounce 0.6s ease-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .milestone-badge .milestone-text {
            color: #000;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .milestone-badge .milestone-subtext {
            color: #000;
            font-size: 16px;
            margin-top: 10px;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(255, 255, 255, 0.5);
        }

        /* Achievement Badge Styles */
        .achievement-badge {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ffd700 0%, #ffcc00 100%);
            border: 4px solid #fff;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 50px rgba(255, 215, 0, 0.8),
                0 0 100px rgba(255, 215, 0, 0.5),
                0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            opacity: 0;
            transition: all 0.5s ease-out;
        }

        .achievement-badge.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            animation: badgePulse 0.5s ease-out, badgeRotate 0.8s ease-out;
        }

        @keyframes badgePulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes badgeRotate {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }

        .achievement-badge .badge-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .achievement-badge .badge-text {
            color: #000;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .achievement-badge .badge-subtext {
            color: rgba(0, 0, 0, 0.8);
            font-size: 14px;
            margin-top: 5px;
            font-weight: 600;
        }

        /* F1 Car and Checkered Flag Animation */
        .f1-car {
            position: fixed;
            font-size: 60px;
            z-index: 999;
            transform: scaleX(-1); /* Flip car to face forward */
            animation: raceCar 2s ease-in-out forwards;
        }

        @keyframes raceCar {
            0% {
                left: -100px;
            }
            100% {
                left: 110%;
            }
        }

        .checkered-flag {
            position: fixed;
            font-size: 60px;
            top: 10%;
            left: 10%;
            z-index: 998;
            animation: waveFlag 0.5s ease-in-out infinite;
        }

        @keyframes waveFlag {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        /* Monthly Chart Styles */
        .monthly-chart-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #333;
        }

        .chart-title {
            color: #ffd700;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .monthly-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            gap: 8px;
            height: 200px;
            padding: 10px;
            background: rgba(26, 26, 26, 0.6);
            border-radius: 15px;
            border: 2px solid rgba(255, 215, 0, 0.2);
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(to top, #ffd700 0%, #ffcc00 100%);
            border-radius: 8px 8px 0 0;
            position: relative;
            min-width: 40px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .chart-bar:hover {
            background: linear-gradient(to top, #ffeb3b 0%, #ffd700 100%);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .chart-bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #999;
            font-weight: 600;
            white-space: nowrap;
        }

        .chart-bar-value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #ffd700;
            font-weight: 700;
        }

        .chart-empty {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .input-section {
                flex-direction: column;
            }

            .filters {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>

        <div class="input-section">
            <input type="text" id="todoInput" placeholder="Add a new task..." />
            <button id="addBtn">Add Task</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <div class="stats">
            <span id="taskCount">0 tasks remaining</span>
            <button id="clearCompleted">Clear Completed</button>
        </div>

        <div class="achievement-stats">
            <div class="total-completed">
                <span class="completed-icon">✓</span>
                <span id="totalCompleted">0</span>
                <span class="completed-label">Tasks Completed</span>
            </div>
        </div>

        <!-- Monthly Chart -->
        <div class="monthly-chart-section">
            <h2 class="chart-title">📊 Monthly Completions</h2>
            <div id="monthlyChart" class="monthly-chart"></div>
        </div>
    </div>

    <!-- Achievement Badge -->
    <div id="achievementBadge" class="achievement-badge">
        <div class="badge-icon">⭐</div>
        <div class="badge-text">Well Done!</div>
        <div class="badge-subtext">Task Completed</div>
    </div>

    <!-- Milestone Badge -->
    <div id="milestoneBadge" class="milestone-badge">
        <div class="milestone-icon">🏆</div>
        <div class="milestone-text">You're Crushing It!</div>
        <div class="milestone-subtext">5 Tasks Milestone!</div>
    </div>

    <script>
        // Get DOM elements
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const taskCount = document.getElementById('taskCount');
        const clearCompletedBtn = document.getElementById('clearCompleted');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // State
        let todos = [];
        let currentFilter = 'all';
        let totalCompletedCount = 0;
        let completionHistory = {}; // Track completions by month (format: "YYYY-MM": count)

        // Load todos from localStorage on page load
        function loadTodos() {
            const savedTodos = localStorage.getItem('todos');
            if (savedTodos) {
                todos = JSON.parse(savedTodos);
                renderTodos();
            }

            // Load total completed count
            const savedTotal = localStorage.getItem('totalCompleted');
            if (savedTotal) {
                totalCompletedCount = parseInt(savedTotal);
                updateTotalCompleted();
            }

            // Load completion history
            const savedHistory = localStorage.getItem('completionHistory');
            if (savedHistory) {
                completionHistory = JSON.parse(savedHistory);
                renderMonthlyChart();
            }
        }

        // Save todos to localStorage
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // Save and update total completed count
        function updateTotalCompleted() {
            localStorage.setItem('totalCompleted', totalCompletedCount);
            document.getElementById('totalCompleted').textContent = totalCompletedCount;
        }

        // Add a new todo
        function addTodo() {
            const text = todoInput.value.trim();

            if (text === '') {
                alert('Please enter a task!');
                return;
            }

            const todo = {
                id: Date.now(),
                text: text,
                completed: false
            };

            todos.push(todo);
            todoInput.value = '';
            saveTodos();
            renderTodos();
        }

        // Delete a todo
        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveTodos();
            renderTodos();
        }

        // Show achievement badge with celebration
        function showAchievementBadge() {
            const badge = document.getElementById('achievementBadge');
            const messages = [
                { icon: '⭐', text: 'Amazing!', sub: 'Task Completed' },
                { icon: '🎉', text: 'Well Done!', sub: 'Keep It Up!' },
                { icon: '✨', text: 'Fantastic!', sub: 'You\'re Crushing It!' },
                { icon: '💖', text: 'Awesome!', sub: 'Task Complete!' },
                { icon: '🌟', text: 'Brilliant!', sub: 'You Did It!' }
            ];

            const msg = messages[Math.floor(Math.random() * messages.length)];
            badge.querySelector('.badge-icon').textContent = msg.icon;
            badge.querySelector('.badge-text').textContent = msg.text;
            badge.querySelector('.badge-subtext').textContent = msg.sub;

            badge.classList.add('show');

            // Create confetti
            createConfetti();

            // Hide after 2 seconds
            setTimeout(() => {
                badge.classList.remove('show');
            }, 2000);
        }

        // Show milestone badge for every 5 tasks
        function showMilestoneBadge() {
            const badge = document.getElementById('milestoneBadge');
            badge.querySelector('.milestone-subtext').textContent = `${totalCompletedCount} Tasks Milestone!`;

            badge.classList.add('show');

            // Create extra special confetti with gold
            createConfetti(true);

            // Hide after 3 seconds (longer than regular)
            setTimeout(() => {
                badge.classList.remove('show');
            }, 3000);
        }

        // Create F1 car racing through checkered flag celebration
        function createConfetti(isMilestone = false) {
            // Create checkered flag at top left
            const flag = document.createElement('div');
            flag.className = 'checkered-flag';
            flag.textContent = '🏁';
            document.body.appendChild(flag);

            // Remove flag after animation
            setTimeout(() => flag.remove(), 2000);

            // Create one F1 car
            const car = document.createElement('div');
            car.className = 'f1-car';
            car.textContent = '🏎️';
            car.style.top = '10%';
            document.body.appendChild(car);

            // Remove car after animation completes
            setTimeout(() => car.remove(), 2000);
        }

        // Render monthly completion chart
        function renderMonthlyChart() {
            const chartContainer = document.getElementById('monthlyChart');

            // Get last 6 months including current month
            const months = [];
            const currentDate = new Date();

            for (let i = 5; i >= 0; i--) {
                const date = new Date(currentDate.getFullYear(), currentDate.getMonth() - i, 1);
                const monthKey = date.toISOString().slice(0, 7); // "YYYY-MM"
                const monthLabel = date.toLocaleDateString('en-US', { month: 'short' });
                months.push({ key: monthKey, label: monthLabel });
            }

            // Find max value for scaling
            const values = months.map(m => completionHistory[m.key] || 0);
            const maxValue = Math.max(...values, 1); // At least 1 to avoid division by zero

            // Check if there's any data
            const hasData = values.some(v => v > 0);

            if (!hasData) {
                chartContainer.innerHTML = '<div class="chart-empty">No completed tasks yet. Complete some tasks to see your monthly progress!</div>';
                return;
            }

            // Create bars
            chartContainer.innerHTML = '';
            months.forEach(month => {
                const count = completionHistory[month.key] || 0;
                const heightPercent = (count / maxValue) * 100;

                const barContainer = document.createElement('div');
                barContainer.style.flex = '1';
                barContainer.style.display = 'flex';
                barContainer.style.flexDirection = 'column';
                barContainer.style.alignItems = 'center';
                barContainer.style.justifyContent = 'flex-end';
                barContainer.style.position = 'relative';
                barContainer.style.height = '100%';

                const bar = document.createElement('div');
                bar.className = 'chart-bar';
                bar.style.height = heightPercent + '%';
                bar.title = `${month.label}: ${count} task${count !== 1 ? 's' : ''}`;

                // Add value label on top of bar
                if (count > 0) {
                    const valueLabel = document.createElement('span');
                    valueLabel.className = 'chart-bar-value';
                    valueLabel.textContent = count;
                    bar.appendChild(valueLabel);
                }

                // Add month label below bar
                const label = document.createElement('span');
                label.className = 'chart-bar-label';
                label.textContent = month.label;

                barContainer.appendChild(bar);
                barContainer.appendChild(label);
                chartContainer.appendChild(barContainer);
            });
        }

        // Toggle todo completion
        function toggleTodo(id) {
            const todo = todos.find(todo => todo.id === id);
            if (todo) {
                const wasCompleted = todo.completed;
                todo.completed = !todo.completed;

                // Show celebration only when marking as complete (not when unchecking)
                if (!wasCompleted && todo.completed) {
                    // Increment total completed count
                    totalCompletedCount++;
                    updateTotalCompleted();

                    // Record completion in monthly history
                    const currentMonth = new Date().toISOString().slice(0, 7); // "YYYY-MM"
                    completionHistory[currentMonth] = (completionHistory[currentMonth] || 0) + 1;
                    localStorage.setItem('completionHistory', JSON.stringify(completionHistory));
                    renderMonthlyChart();

                    // Check if this is a milestone (every 5 tasks)
                    if (totalCompletedCount % 5 === 0) {
                        // Show special milestone celebration
                        showMilestoneBadge();
                    } else {
                        // Show regular achievement badge
                        showAchievementBadge();
                    }
                }

                saveTodos();
                renderTodos();
            }
        }

        // Clear completed todos
        function clearCompleted() {
            todos = todos.filter(todo => !todo.completed);
            saveTodos();
            renderTodos();
        }

        // Filter todos
        function filterTodos() {
            switch (currentFilter) {
                case 'active':
                    return todos.filter(todo => !todo.completed);
                case 'completed':
                    return todos.filter(todo => todo.completed);
                default:
                    return todos;
            }
        }

        // Render todos
        function renderTodos() {
            const filteredTodos = filterTodos();

            // Clear the list
            todoList.innerHTML = '';

            // Show empty state if no todos
            if (filteredTodos.length === 0) {
                todoList.innerHTML = '<div class="empty-state">No tasks to display</div>';
            } else {
                filteredTodos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.completed ? 'completed' : ''}`;

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'todo-checkbox';
                    checkbox.checked = todo.completed;
                    checkbox.addEventListener('change', () => toggleTodo(todo.id));

                    const textSpan = document.createElement('span');
                    textSpan.className = 'todo-text';
                    textSpan.textContent = todo.text;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

                    li.appendChild(checkbox);
                    li.appendChild(textSpan);
                    li.appendChild(deleteBtn);
                    todoList.appendChild(li);
                });
            }

            // Update task count
            const activeTasks = todos.filter(todo => !todo.completed).length;
            taskCount.textContent = `${activeTasks} task${activeTasks !== 1 ? 's' : ''} remaining`;
        }

        // Event listeners
        addBtn.addEventListener('click', addTodo);

        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        clearCompletedBtn.addEventListener('click', clearCompleted);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Remove active class from all buttons
                filterBtns.forEach(b => b.classList.remove('active'));

                // Add active class to clicked button
                e.target.classList.add('active');

                // Update current filter
                currentFilter = e.target.dataset.filter;

                // Re-render todos
                renderTodos();
            });
        });

        // Initialize the app
        loadTodos();
    </script>
</body>
</html>
