<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #000000;
            /* BLACKPINK-inspired abstract gradient background */
            background-image:
                linear-gradient(135deg,
                    rgba(0, 0, 0, 0.8) 0%,
                    rgba(20, 0, 20, 0.9) 25%,
                    rgba(40, 0, 40, 0.85) 50%,
                    rgba(20, 0, 20, 0.9) 75%,
                    rgba(0, 0, 0, 0.8) 100%
                ),
                radial-gradient(ellipse at 10% 20%, rgba(255, 20, 147, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 105, 180, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(139, 0, 139, 0.2) 0%, transparent 70%),
                linear-gradient(180deg, #000000 0%, #0a0a0a 100%);
            /*
            FREE UNSPLASH ALTERNATIVES - Replace above with any of these:

            Option 1 - Pink/Black Abstract:
            url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1920'),

            Option 2 - Neon Pink Abstract:
            url('https://images.unsplash.com/photo-1557672172-298e090bd0f1?w=1920'),

            Option 3 - Dark Pink Gradient:
            url('https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=1920'),

            Then add dark overlay:
            linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.85)),
            */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 3px solid #ff1493;
            border-radius: 20px;
            box-shadow:
                0 0 40px rgba(255, 20, 147, 0.5),
                0 0 80px rgba(255, 20, 147, 0.3),
                inset 0 0 60px rgba(255, 20, 147, 0.05);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: #ff1493;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow:
                0 0 10px rgba(255, 20, 147, 0.8),
                0 0 20px rgba(255, 20, 147, 0.6),
                0 0 30px rgba(255, 20, 147, 0.4),
                0 0 40px rgba(255, 20, 147, 0.2);
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 50%, #ff1493 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        h1::before {
            content: '♥';
            position: absolute;
            left: -40px;
            color: #ff1493;
            -webkit-text-fill-color: #ff1493;
            animation: pulse 2s infinite;
        }

        h1::after {
            content: '♥';
            position: absolute;
            right: -40px;
            color: #ff1493;
            -webkit-text-fill-color: #ff1493;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #todoInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid rgba(255, 20, 147, 0.3);
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s;
            background: rgba(26, 26, 26, 0.6);
            color: #fff;
            backdrop-filter: blur(5px);
        }

        #todoInput:focus {
            outline: none;
            border-color: #ff1493;
            box-shadow:
                0 0 20px rgba(255, 20, 147, 0.4),
                inset 0 0 10px rgba(255, 20, 147, 0.1);
            background: rgba(26, 26, 26, 0.8);
        }

        #todoInput::placeholder {
            color: #999;
            font-style: italic;
        }

        #addBtn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow:
                0 0 20px rgba(255, 20, 147, 0.6),
                0 4px 15px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        #addBtn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        #addBtn:hover::before {
            left: 100%;
        }

        #addBtn:hover {
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            box-shadow:
                0 0 30px rgba(255, 20, 147, 0.8),
                0 4px 20px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        #addBtn:active {
            transform: scale(0.98);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 24px;
            background: transparent;
            border: 2px solid #ff1493;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff1493;
        }

        .filter-btn:hover {
            background: rgba(255, 20, 147, 0.1);
            border-color: #ff69b4;
            color: #ff69b4;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.3);
        }

        .filter-btn:active {
            transform: scale(0.95);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: white;
            border-color: #ff1493;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
        }

        .todo-list {
            list-style: none;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 18px;
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.8) 0%, rgba(42, 42, 42, 0.6) 100%);
            border: 1px solid rgba(255, 20, 147, 0.2);
            border-radius: 15px;
            margin-bottom: 12px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease-out;
            backdrop-filter: blur(5px);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .todo-item:hover {
            background: linear-gradient(135deg, rgba(42, 42, 42, 0.9) 0%, rgba(51, 51, 51, 0.7) 100%);
            border-color: #ff1493;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.3);
            transform: translateX(8px);
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #666;
        }

        .todo-checkbox {
            width: 22px;
            height: 22px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #ff1493;
            filter: drop-shadow(0 0 3px rgba(255, 20, 147, 0.5));
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #fff;
        }

        .delete-btn {
            background: transparent;
            color: #ff1493;
            border: 2px solid #ff1493;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .delete-btn:hover {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: white;
            border-color: #ff1493;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
            transform: scale(1.05);
        }

        .delete-btn:active {
            transform: scale(0.98);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid #333;
            font-size: 14px;
            color: #aaa;
        }

        #clearCompleted {
            background: transparent;
            color: #ff1493;
            border: 2px solid #ff1493;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #clearCompleted:hover {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: white;
            border-color: #ff1493;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
            transform: scale(1.05);
        }

        #clearCompleted:active {
            transform: scale(0.98);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }

        /* Achievement Badge Styles */
        .achievement-badge {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            border: 4px solid #fff;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 50px rgba(255, 20, 147, 0.8),
                0 0 100px rgba(255, 20, 147, 0.5),
                0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            opacity: 0;
            transition: all 0.5s ease-out;
        }

        .achievement-badge.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            animation: badgePulse 0.5s ease-out, badgeRotate 0.8s ease-out;
        }

        @keyframes badgePulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes badgeRotate {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }

        .achievement-badge .badge-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .achievement-badge .badge-text {
            color: white;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .achievement-badge .badge-subtext {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Confetti Styles */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff1493;
            position: absolute;
            animation: confettiFall 3s linear forwards;
            z-index: 999;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotateZ(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotateZ(720deg);
                opacity: 0;
            }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff1493;
            border-radius: 50%;
            animation: sparkleFloat 1s ease-out forwards;
            pointer-events: none;
            z-index: 998;
        }

        @keyframes sparkleFloat {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .input-section {
                flex-direction: column;
            }

            .filters {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>

        <div class="input-section">
            <input type="text" id="todoInput" placeholder="Add a new task..." />
            <button id="addBtn">Add Task</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <div class="stats">
            <span id="taskCount">0 tasks remaining</span>
            <button id="clearCompleted">Clear Completed</button>
        </div>
    </div>

    <!-- Achievement Badge -->
    <div id="achievementBadge" class="achievement-badge">
        <div class="badge-icon">⭐</div>
        <div class="badge-text">Well Done!</div>
        <div class="badge-subtext">Task Completed</div>
    </div>

    <script>
        // Get DOM elements
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const taskCount = document.getElementById('taskCount');
        const clearCompletedBtn = document.getElementById('clearCompleted');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // State
        let todos = [];
        let currentFilter = 'all';

        // Load todos from localStorage on page load
        function loadTodos() {
            const savedTodos = localStorage.getItem('todos');
            if (savedTodos) {
                todos = JSON.parse(savedTodos);
                renderTodos();
            }
        }

        // Save todos to localStorage
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // Add a new todo
        function addTodo() {
            const text = todoInput.value.trim();

            if (text === '') {
                alert('Please enter a task!');
                return;
            }

            const todo = {
                id: Date.now(),
                text: text,
                completed: false
            };

            todos.push(todo);
            todoInput.value = '';
            saveTodos();
            renderTodos();
        }

        // Delete a todo
        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveTodos();
            renderTodos();
        }

        // Show achievement badge with celebration
        function showAchievementBadge() {
            const badge = document.getElementById('achievementBadge');
            const messages = [
                { icon: '⭐', text: 'Amazing!', sub: 'Task Completed' },
                { icon: '🎉', text: 'Well Done!', sub: 'Keep It Up!' },
                { icon: '✨', text: 'Fantastic!', sub: 'You\'re Crushing It!' },
                { icon: '💖', text: 'Awesome!', sub: 'Task Complete!' },
                { icon: '🌟', text: 'Brilliant!', sub: 'You Did It!' }
            ];

            const msg = messages[Math.floor(Math.random() * messages.length)];
            badge.querySelector('.badge-icon').textContent = msg.icon;
            badge.querySelector('.badge-text').textContent = msg.text;
            badge.querySelector('.badge-subtext').textContent = msg.sub;

            badge.classList.add('show');

            // Create confetti
            createConfetti();

            // Hide after 2 seconds
            setTimeout(() => {
                badge.classList.remove('show');
            }, 2000);
        }

        // Create confetti effect
        function createConfetti() {
            const colors = ['#ff1493', '#ff69b4', '#fff', '#ffc0cb'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        // Toggle todo completion
        function toggleTodo(id) {
            const todo = todos.find(todo => todo.id === id);
            if (todo) {
                const wasCompleted = todo.completed;
                todo.completed = !todo.completed;

                // Show celebration only when marking as complete (not when unchecking)
                if (!wasCompleted && todo.completed) {
                    showAchievementBadge();
                }

                saveTodos();
                renderTodos();
            }
        }

        // Clear completed todos
        function clearCompleted() {
            todos = todos.filter(todo => !todo.completed);
            saveTodos();
            renderTodos();
        }

        // Filter todos
        function filterTodos() {
            switch (currentFilter) {
                case 'active':
                    return todos.filter(todo => !todo.completed);
                case 'completed':
                    return todos.filter(todo => todo.completed);
                default:
                    return todos;
            }
        }

        // Render todos
        function renderTodos() {
            const filteredTodos = filterTodos();

            // Clear the list
            todoList.innerHTML = '';

            // Show empty state if no todos
            if (filteredTodos.length === 0) {
                todoList.innerHTML = '<div class="empty-state">No tasks to display</div>';
            } else {
                filteredTodos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.completed ? 'completed' : ''}`;

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'todo-checkbox';
                    checkbox.checked = todo.completed;
                    checkbox.addEventListener('change', () => toggleTodo(todo.id));

                    const textSpan = document.createElement('span');
                    textSpan.className = 'todo-text';
                    textSpan.textContent = todo.text;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

                    li.appendChild(checkbox);
                    li.appendChild(textSpan);
                    li.appendChild(deleteBtn);
                    todoList.appendChild(li);
                });
            }

            // Update task count
            const activeTasks = todos.filter(todo => !todo.completed).length;
            taskCount.textContent = `${activeTasks} task${activeTasks !== 1 ? 's' : ''} remaining`;
        }

        // Event listeners
        addBtn.addEventListener('click', addTodo);

        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        clearCompletedBtn.addEventListener('click', clearCompleted);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Remove active class from all buttons
                filterBtns.forEach(b => b.classList.remove('active'));

                // Add active class to clicked button
                e.target.classList.add('active');

                // Update current filter
                currentFilter = e.target.dataset.filter;

                // Re-render todos
                renderTodos();
            });
        });

        // Initialize the app
        loadTodos();
    </script>
</body>
</html>
