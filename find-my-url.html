<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Rap Generator Link</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 20, 147, 0.1);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #ff1493;
        }
        h1 {
            color: #ff1493;
            text-align: center;
            font-size: 2rem;
        }
        .url-box {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid #ff69b4;
        }
        .big-url {
            color: #ff69b4;
            font-size: 1.2rem;
            word-break: break-all;
            font-weight: bold;
        }
        .step {
            background: rgba(255, 105, 180, 0.1);
            padding: 15px;
            margin: 15px 0;
            border-left: 4px solid #ff1493;
            border-radius: 5px;
        }
        .step-number {
            color: #ff1493;
            font-size: 1.5rem;
            font-weight: bold;
        }
        button {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Your Rap Generator Link 🎤</h1>

        <div class="step">
            <span class="step-number">📱 Step 1:</span>
            <p>Copy this URL below:</p>
        </div>

        <div class="url-box">
            <div class="big-url" id="rapUrl">Loading your URL...</div>
        </div>

        <button onclick="copyUrl()">📋 Copy Link to Clipboard</button>
        <button onclick="openRap()">🎤 Open Rap Generator Now</button>

        <div class="step">
            <span class="step-number">📱 Step 2:</span>
            <p>Open <strong>Safari</strong> on your iPad and paste the link in the address bar</p>
        </div>

        <div class="step">
            <span class="step-number">🎉 Step 3:</span>
            <p>Start creating amazing raps about any topic!</p>
        </div>
    </div>

    <script>
        // Get the current URL and construct the rap generator URL
        const currentUrl = window.location.href;
        const baseUrl = currentUrl.replace('/find-my-url.html', '');
        const rapUrl = baseUrl + '/rap-generator-standalone.html';

        // Display the URL
        document.getElementById('rapUrl').textContent = rapUrl;

        function copyUrl() {
            const url = document.getElementById('rapUrl').textContent;
            navigator.clipboard.writeText(url).then(() => {
                alert('✅ Link copied! Now paste it in Safari on your iPad!');
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = url;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('✅ Link copied! Now paste it in Safari on your iPad!');
            });
        }

        function openRap() {
            window.location.href = 'rap-generator-standalone.html';
        }
    </script>
</body>
</html>
