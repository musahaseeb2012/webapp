<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main Menu Screen -->
    <div id="mainMenu" class="main-menu">
        <div class="menu-content">
            <div class="menu-header">
                <div class="menu-icon">⚡</div>
                <h1 class="menu-title">Productivity Hub</h1>
                <p class="menu-subtitle">Choose your tool to get things done</p>
            </div>

            <div class="menu-options">
                <button id="todoListBtn" class="menu-option">
                    <div class="option-icon">✓</div>
                    <div class="option-title">To-Do List</div>
                    <div class="option-description">Manage your daily tasks</div>
                </button>

                <button class="menu-option disabled">
                    <div class="option-icon">📝</div>
                    <div class="option-title">Notes</div>
                    <div class="option-description">Coming Soon</div>
                </button>

                <button class="menu-option disabled">
                    <div class="option-icon">📅</div>
                    <div class="option-title">Calendar</div>
                    <div class="option-description">Coming Soon</div>
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="app-header">
            <button id="backToMenuBtn" class="back-btn">← Back to Menu</button>
            <h1>My To-Do List</h1>
        </div>

        <div class="input-section">
            <input type="text" id="todoInput" placeholder="Add a new task..." />
            <button id="addBtn">Add Task</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <div class="stats">
            <span id="taskCount">0 tasks remaining</span>
            <button id="clearCompleted">Clear Completed</button>
        </div>

        <div class="achievement-stats">
            <div class="total-completed">
                <span class="completed-icon">✓</span>
                <span id="totalCompleted">0</span>
                <span class="completed-label">Tasks Completed</span>
            </div>
        </div>
    </div>

    <!-- Achievement Badge -->
    <div id="achievementBadge" class="achievement-badge">
        <div class="badge-icon">⭐</div>
        <div class="badge-text">Well Done!</div>
        <div class="badge-subtext">Task Completed</div>
    </div>

    <!-- Milestone Badge -->
    <div id="milestoneBadge" class="milestone-badge">
        <div class="milestone-icon">🏆</div>
        <div class="milestone-text">You're Crushing It!</div>
        <div class="milestone-subtext">5 Tasks Milestone!</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
