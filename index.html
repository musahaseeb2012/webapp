<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Car Logo Designer - Ferrari Edition</title>
    <meta http-equiv="refresh" content="0; url=car-logo-designer.html">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .redirect-message {
            text-align: center;
            padding: 40px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(220, 0, 0, 0.2);
            border-top: 5px solid #DC0000;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 2rem;
            color: #DC0000;
            margin-bottom: 15px;
        }

        p {
            color: #aaa;
            margin-bottom: 20px;
        }

        a {
            color: #DC0000;
            text-decoration: none;
            font-weight: 700;
            padding: 10px 20px;
            border: 2px solid #DC0000;
            border-radius: 10px;
            display: inline-block;
            transition: all 0.3s;
        }

        a:hover {
            background: #DC0000;
            color: #ffffff;
        }
    </style>
    <script>
        // Immediate redirect to car logo designer
        window.location.replace('car-logo-designer.html');
    </script>
</head>
<body>
    <div class="redirect-message">
        <div class="loader"></div>
        <h1>Redirecting to Car Logo Designer...</h1>
        <p>If you are not redirected automatically, click below:</p>
        <a href="car-logo-designer.html">Go to Car Logo Designer</a>
    </div>
</body>
</html>
