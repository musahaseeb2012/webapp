<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S.</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23140000' stroke='%23ffd700' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%23dc143c'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23ffd700'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="jarvis.css">
</head>
<body>
    <div class="container">
        <div class="app-header">
            <button id="clearChatBtn" class="back-btn">⟲ New Session</button>
            <div class="header-title">
                <div class="reactor" id="reactor">
                    <div class="reactor-core"></div>
                    <div class="reactor-ring"></div>
                    <div class="reactor-ring reactor-ring-2"></div>
                </div>
                <div>
                    <h1>Jarvis</h1>
                    <p class="subtitle">Just A Rather Very Intelligent System</p>
                </div>
            </div>
            <div class="status-bar">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Online</span>
            </div>
        </div>

        <div class="chat-log" id="chatLog"></div>

        <div class="typing-indicator" id="typingIndicator">
            <span class="typing-name">Jarvis is thinking</span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>

        <div class="quick-actions">
            <button class="filter-btn" data-say="What can you do?">Abilities</button>
            <button class="filter-btn" data-say="What time is it?">Time</button>
            <button class="filter-btn" data-say="Tell me a joke">Joke</button>
            <button class="filter-btn" data-say="Give me a status report">Status</button>
            <button class="filter-btn" data-say="Flip a coin">Coin Flip</button>
        </div>

        <div class="input-section">
            <button id="micBtn" class="icon-btn" title="Speak to Jarvis">🎙️</button>
            <input type="text" id="chatInput" placeholder="Speak to Jarvis..." autocomplete="off" />
            <button id="sendBtn">Send</button>
        </div>

        <div id="keyPanel" class="key-panel">
            <p class="key-explain">
                Paste an Anthropic API key to give Jarvis a real language model. It is stored
                only in this browser and sent only to Anthropic. Without one he runs on his
                built-in offline brain.
            </p>
            <div class="key-row">
                <input type="password" id="keyInput" placeholder="sk-ant-..." autocomplete="off" />
                <button id="keySave" class="key-btn">Save</button>
                <button id="keyClear" class="key-btn ghost">Clear</button>
            </div>
            <p class="key-status" id="keyStatus"></p>
        </div>

        <div class="footer-bar">
            <label class="toggle">
                <input type="checkbox" id="voiceToggle" checked />
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span class="toggle-label">Voice Reply</span>
            </label>
            <button id="keyToggle" class="key-toggle" title="Connect a language model">⚙ Brain</button>
            <span id="msgCount" class="msg-count">0 exchanges</span>
        </div>
    </div>

    <script src="jarvis.js"></script>
</body>
</html>
